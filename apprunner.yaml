version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  runtime-version: 20
  command: npm run start
  network:
    port: 8080
    env: PORT
  env:
    - name: NODE_ENV
      value: production
# Everything else this app needs at runtime (MONGODB_URI, JWT_SECRET, the email-provider
# credentials, etc. — see .env.example for the full list) is intentionally not set here: this
# file is checked into the repo, so no secret belongs in it. Configure those on the App Runner
# service itself (plain env vars for non-secret config, Secrets Manager references for the rest
# — see CLAUDE.md's Stack section) instead.
#
# This config covers the HTTP API server (src/server.ts) only. The separate BullMQ worker process
# (`npm run start:worker`, src/worker.ts — mailbox polling, enrollment processing, the
# DISCOVERY_RETRY graduation sweep, etc.) has its own App Runner config now: apprunner-worker.yaml,
# a second App Runner service pointed at this same repo/build with a different start command and
# health-check path — see that file for why and how.
