name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: test -f package.json && npm install || echo "no package.json yet, skipping"
      - name: Build
        run: test -f package.json && npm run build --if-present || echo "skipping build"
      - name: Lint
        run: test -f package.json && npm run lint --if-present || echo "skipping lint"
