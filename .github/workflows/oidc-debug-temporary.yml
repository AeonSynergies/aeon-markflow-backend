# TEMPORARY — diagnostic only, not part of the real pipeline.
#
# Prints this repo's actual GitHub Actions OIDC token claims (notably `sub`) to the run log, so
# the IAM role's trust-policy condition for .github/workflows/ecr-publish.yml (PR #47) can be
# written against the real value instead of a guess. Safe to run because this is a private repo
# and nothing here is a secret — the printed claims are GitHub's own token metadata, not
# credentials. Delete this workflow file once the `sub` value has been read out of a run.
#
# github/actions-oidc-debugger (the action this was originally going to use) is archived — its
# own README now recommends this inline replacement instead of the action itself, credited to
# steve-todorov: https://github.com/github/actions-oidc-debugger/issues/30#issuecomment-3169059282
# Adapted here to also handle base64url's `-`/`_` alphabet and re-pad it, since the JWT spec (RFC
# 7515) encodes with that alphabet and `base64 -d` alone expects standard base64.
name: OIDC Debug (temporary — delete after use)

on:
  workflow_dispatch:
    inputs:
      audience:
        description: 'Audience to request the OIDC token for (sts.amazonaws.com matches what ecr-publish.yml will request from AWS)'
        required: false
        default: 'sts.amazonaws.com'

permissions:
  contents: read
  id-token: write

jobs:
  print-oidc-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request and decode the OIDC token
        env:
          AUDIENCE: ${{ inputs.audience }}
        run: |
          set -euo pipefail

          token_json=$(curl -sf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          id_token=$(echo "$token_json" | jq -r .value)

          # JWT payload is the 2nd dot-separated segment, base64url-encoded (RFC 7515) — convert
          # to standard base64 (- -> +, _ -> /) and re-pad to a multiple of 4 before decoding.
          payload=$(echo "$id_token" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac

          echo "Decoded OIDC token claims:"
          echo "$payload" | base64 -d | jq .

          echo ""
          echo "sub claim:"
          echo "$payload" | base64 -d | jq -r .sub
